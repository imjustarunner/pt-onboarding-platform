steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'scripts/prospect-demo-release/backend.Dockerfile', '-t', 'us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-backend/onboarding-backend:champions-20261111-v2', '.']
images:
  - us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-backend/onboarding-backend:champions-20261111-v2
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
serviceAccount: projects/ptonboard-dev/serviceAccounts/github-deployer@ptonboard-dev.iam.gserviceaccount.com
timeout: 1200s
