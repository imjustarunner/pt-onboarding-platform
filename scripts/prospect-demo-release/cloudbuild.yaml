steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'scripts/prospect-demo-release/backend.Dockerfile', '-t', 'us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-backend/onboarding-backend:champions-20261111-v1', '.']
  - id: frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'scripts/prospect-demo-release/frontend.Dockerfile', '-t', 'us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-frontend/onboarding-frontend:champions-20261111-v1', '.']
images:
  - us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-backend/onboarding-backend:champions-20261111-v1
  - us-west3-docker.pkg.dev/$PROJECT_ID/onboarding-frontend/onboarding-frontend:champions-20261111-v1
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
