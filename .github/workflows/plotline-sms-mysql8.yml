name: Plotline SMS MySQL 8 provisioning
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['codex/plotline-narriva-training-paired-release-20261126']
jobs:
  immutable-provisioning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-disposable-ci-only
        ports: ['33319:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-disposable-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - name: Exercise fixed manifest and procedure-only grants on MySQL 8
        env:
          PLOTLINE_PROVISIONING_TEST_MYSQL_URL: mysql://root:synthetic-disposable-ci-only@127.0.0.1:33319
        run: ./frontend/node_modules/.bin/vitest run --config backend/vitest.plotline-sms-activation.config.js backend/src/services/__tests__/plotlineSenderProvisioning.mysql.test.js
