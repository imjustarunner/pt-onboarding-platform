name: Recovered workflow boundaries

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'database/migrations/1750_people_operations_submission_notifications.sql', 'database/migrations/1751_school_annual_update_runtime.sql', 'database/migrations/1752_client_update_workflows.sql', '.github/workflows/recovered-workflows.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'database/migrations/1750_people_operations_submission_notifications.sql', 'database/migrations/1751_school_annual_update_runtime.sql', 'database/migrations/1752_client_update_workflows.sql', '.github/workflows/recovered-workflows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovered-workflows:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['33316:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TZ: America/Denver
      SKIP_DB_CONNECT: '1'
      SKIP_CLINICAL_DB_CONNECT: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '1'
      DB_USER: workflow_tests_never_prod
      DB_PASSWORD: unused
      DB_NAME: never_production
      RECOVERY_TEST_MYSQL_HOST: 127.0.0.1
      RECOVERY_TEST_MYSQL_PORT: '33316'
      RECOVERY_TEST_MYSQL_USER: root
      RECOVERY_TEST_MYSQL_PASSWORD: ''
      SCHEDULING_TEST_MYSQL_PORT: '33316'
      FAMILY_WELCOME_TEST_MYSQL_PORT: '33316'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend --ignore-scripts
      - name: Enrollment, guardian decisions and paper packet regressions
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.qa-final1110.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.paper-followup.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.paper-mysql.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-roi-followup.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.qa-final1110.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.paper-followup.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.school-roi-followup.config.js
          NODE_ENV=test node --test backend/src/services/__tests__/billingCoverage.audit.test.js backend/src/services/__tests__/smartDisclosureParties.test.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.enrollment-repairs.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.enrollment-repairs.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.brief-1109.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.brief-1109.config.js
          node --test backend/src/services/__tests__/noteAidImportParsers.test.js backend/src/services/__tests__/noteAidDemographicsAndPlanParsers.test.js backend/src/services/__tests__/treatmentPlanContext.test.js
          NODE_ENV=test node --test backend/src/services/__tests__/completedIntakeRecord.service.test.js backend/src/services/__tests__/guardianSchoolRoi.service.test.js
      - name: Scoped People Operations and hiring source receipts
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.hire.config.js
      - name: Scoped address suggestions and form isolation
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.address-autocomplete.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.address-autocomplete.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.address-static.config.js
      - name: Optional card-funded Link and payment owner boundaries
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.stripe-link.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.stripe-link.config.js
      - name: Fresh school annual and client update schemas and delivery boundaries
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-annual.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.client-updates.config.js
      - name: Independent dashboard loading and scoped workflow interfaces
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.startup-recovery.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.school-annual.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.client-updates.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.people-operations-notifications.config.js

      - name: Audited packet views and persistent file-access review
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.security-evidence.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.file-review.config.js

      - name: Family welcome editing, provider isolation and accelerated outreach
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-contact-plan.config.js
          cd frontend
          node node_modules/vitest/vitest.mjs run --config vitest.school-contact-plan.config.js
