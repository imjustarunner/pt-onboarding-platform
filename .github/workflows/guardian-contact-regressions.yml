name: Guardian contact and relationship regressions
on:
  pull_request:
    paths:
      - 'backend/src/controllers/clientGuardian.controller.js'
      - 'backend/src/controllers/user.controller.js'
      - 'backend/src/controllers/guardianAccountWorkspace.controller.js'
      - 'backend/src/controllers/__tests__/guardianAccountWorkspace.test.js'
      - 'backend/src/services/guardianFinancialWorkspace.service.js'
      - 'backend/src/services/__tests__/guardianFinancialWorkspace.test.js'
      - 'backend/src/services/familyLedger/collections.js'
      - 'backend/src/services/__tests__/guardianStatements.test.js'
      - 'backend/src/services/staffVerbalReminderConsent.service.js'
      - 'frontend/src/services/api.js'
      - 'frontend/src/components/admin/UserCommunicationsTab.vue'
      - 'frontend/src/components/billing/ResponsibleBillingParty.vue'
      - 'backend/src/controllers/__tests__/guardianRelationshipRestore.test.js'
      - 'frontend/src/views/admin/UserProfileView.vue'
      - 'frontend/src/composables/useGuardianClientSearch.js'
      - 'frontend/src/composables/__tests__/useGuardianClientSearch.test.js'
      - 'backend/src/controllers/__tests__/clientGuardianPortalModes.test.js'
      - 'backend/src/controllers/__tests__/clientGuardianContactSave.test.js'
      - 'backend/src/models/__tests__/schoolGuardianPolicy.concurrentAccess.test.js'
      - 'backend/src/models/ClientGuardian.model.js'
      - 'backend/src/routes/client.routes.js'
      - 'backend/src/routes/__tests__/guardianContactMethods.test.js'
      - 'backend/src/services/guardianContactContext.service.js'
      - 'backend/src/services/guardianWorkspace.service.js'
      - 'backend/src/services/linkedGuardianContact.service.js'
      - 'backend/src/services/__tests__/guardianContactContext.account.test.js'
      - 'backend/src/services/__tests__/guardianWorkspace.test.js'
      - 'backend/src/services/__tests__/linkedGuardianContact.test.js'
      - 'frontend/src/components/admin/*Guardian*.vue'
      - 'frontend/src/components/admin/__tests__/*Guardian*.test.js'
      - '**/vitest.guardian-contact.config.js'
      - '.github/workflows/guardian-contact-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/controllers/clientGuardian.controller.js'
      - 'backend/src/controllers/user.controller.js'
      - 'backend/src/controllers/guardianAccountWorkspace.controller.js'
      - 'backend/src/controllers/__tests__/guardianAccountWorkspace.test.js'
      - 'backend/src/services/guardianFinancialWorkspace.service.js'
      - 'backend/src/services/__tests__/guardianFinancialWorkspace.test.js'
      - 'backend/src/services/familyLedger/collections.js'
      - 'backend/src/services/__tests__/guardianStatements.test.js'
      - 'backend/src/services/staffVerbalReminderConsent.service.js'
      - 'frontend/src/services/api.js'
      - 'frontend/src/components/admin/UserCommunicationsTab.vue'
      - 'frontend/src/components/billing/ResponsibleBillingParty.vue'
      - 'backend/src/controllers/__tests__/guardianRelationshipRestore.test.js'
      - 'frontend/src/views/admin/UserProfileView.vue'
      - 'frontend/src/composables/useGuardianClientSearch.js'
      - 'frontend/src/composables/__tests__/useGuardianClientSearch.test.js'
      - 'backend/src/controllers/__tests__/clientGuardianPortalModes.test.js'
      - 'backend/src/controllers/__tests__/clientGuardianContactSave.test.js'
      - 'backend/src/models/__tests__/schoolGuardianPolicy.concurrentAccess.test.js'
      - 'backend/src/models/ClientGuardian.model.js'
      - 'backend/src/routes/client.routes.js'
      - 'backend/src/routes/__tests__/guardianContactMethods.test.js'
      - 'backend/src/services/guardianContactContext.service.js'
      - 'backend/src/services/guardianWorkspace.service.js'
      - 'backend/src/services/linkedGuardianContact.service.js'
      - 'backend/src/services/__tests__/guardianContactContext.account.test.js'
      - 'backend/src/services/__tests__/guardianWorkspace.test.js'
      - 'backend/src/services/__tests__/linkedGuardianContact.test.js'
      - 'frontend/src/components/admin/*Guardian*.vue'
      - 'frontend/src/components/admin/__tests__/*Guardian*.test.js'
      - '**/vitest.guardian-contact.config.js'
      - '.github/workflows/guardian-contact-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without building the app
        run: |
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm rebuild bcrypt --prefix backend --no-audit --no-fund
      - name: Check guardian contact and relationship behavior
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.guardian-contact.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.guardian-contact.config.js
