      - 'backend/src/controllers/__tests__/clientGuardianPortalModes.test.js'
      - 'backend/src/controllers/__tests__/clientGuardianContactSave.test.js'
      - 'backend/src/models/__tests__/schoolGuardianPolicy.concurrentAccess.test.js'
      - 'backend/src/models/ClientGuardian.model.js'
