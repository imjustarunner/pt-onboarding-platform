name: Payroll wizard and report delivery
on:
  pull_request:
    paths:
      - 'backend/src/**/payroll*'
      - 'backend/src/**/Payroll*'
      - 'backend/src/services/communicationRecordDelivery.service.js'
      - 'backend/src/services/__tests__/communicationRecordDelivery.test.js'
      - 'backend/vitest.payroll-wizard.config.js'
      - 'frontend/src/components/payroll/**'
      - 'frontend/src/views/admin/Payroll*'
      - 'frontend/src/views/admin/__tests__/PayrollWizardFlow.test.js'
      - 'frontend/src/views/admin/__tests__/PayrollPendingSubmissions.test.js'
      - 'frontend/src/composables/usePayrollClaimReview.js'
      - 'frontend/src/composables/__tests__/usePayrollClaimReview.test.js'
      - 'frontend/src/utils/payroll*'
      - 'frontend/src/utils/__tests__/payrollWizardFlow.test.js'
      - 'frontend/vitest.payroll-wizard.config.js'
      - 'database/migrations/*_payroll_report_email_deliveries.sql'
      - '.github/workflows/payroll-wizard.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/**/payroll*'
      - 'backend/src/**/Payroll*'
      - 'frontend/src/components/payroll/**'
      - 'frontend/src/views/admin/Payroll*'
      - '.github/workflows/payroll-wizard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payroll:
    runs-on: ubuntu-latest
    env:
      SKIP_DB_CONNECT: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies without the frontend postinstall build
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend --ignore-scripts
      - name: Guided navigation, review gates and empty states
        run: node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.payroll-wizard.config.js
      - name: Payroll access, draft decisions and attached report delivery
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.payroll-wizard.config.js
      - name: Preserved work-time records and leave calculations
        run: node --test backend/src/utils/__tests__/payrollActualHoursReview.test.js backend/src/utils/__tests__/payrollSickLeaveHours.test.js
