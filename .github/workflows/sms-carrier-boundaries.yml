name: SMS carrier and campaign boundaries
on:
  push:
    branches: [main]
    paths: ['backend/src/**/sms*', 'backend/src/**/notifyre*', 'backend/src/**/vonage*', 'backend/src/**/providerSms*', 'backend/src/**/providerRelay*', 'backend/src/services/communicationRouting.service.js', 'backend/src/services/companyEventSms.service.js', 'backend/src/services/companyEventPages.service.js', 'backend/src/services/companyEventLinks.service.js', 'backend/src/utils/companyEventPage.js', 'frontend/src/views/public/CompanyEventStaffView.vue', 'frontend/scripts/build-product-domains.mjs', 'backend/src/services/conversaTeamRecipients.service.js', 'backend/src/controllers/companyEvents.controller.js', 'backend/src/routes/agency.routes.js', 'frontend/src/components/conversa/ConversaTeamCommunications.vue', 'frontend/src/components/conversa/__tests__/ConversaTeamCommunications.test.js', 'frontend/src/components/admin/StaffPollResultsReview.vue', 'frontend/src/components/admin/__tests__/StaffPollResultsReview.test.js', 'frontend/src/components/dashboard/StaffPollsPanel.vue', 'frontend/src/components/dashboard/__tests__/StaffPollsPanel*.test.js', 'frontend/src/views/StaffEventView.vue', 'frontend/src/views/__tests__/StaffEventView.test.js', 'frontend/vitest.staff-polls.config.js', 'backend/src/utils/staffPollPresentation.js', 'backend/src/services/staffPoll*.js', 'backend/src/services/staffEventPotluck.service.js', 'backend/src/utils/staffPollDeliveryHistory.js', 'frontend/src/components/conversa/StaffPollDeliveryHistory.vue', 'frontend/src/components/conversa/__tests__/StaffPollDeliveryHistory.test.js', 'frontend/src/components/admin/StaffEventForm.vue', 'frontend/src/views/public/CompanyEventRsvpView.vue', 'database/migrations/1784_conversa_poll_delivery_visibility.sql', 'backend/src/services/auricwell/**', 'backend/src/**/__tests__/messaging.*', 'backend/src/**/__tests__/enrollmentCompletion.*', 'backend/vitest.sms-carrier.config.js', '.github/workflows/sms-carrier-boundaries.yml']
  pull_request:
    paths: ['backend/src/**/sms*', 'backend/src/**/notifyre*', 'backend/src/**/vonage*', 'backend/src/**/providerSms*', 'backend/src/**/providerRelay*', 'backend/src/services/communicationRouting.service.js', 'backend/src/services/companyEventSms.service.js', 'backend/src/services/companyEventPages.service.js', 'backend/src/services/companyEventLinks.service.js', 'backend/src/utils/companyEventPage.js', 'frontend/src/views/public/CompanyEventStaffView.vue', 'frontend/scripts/build-product-domains.mjs', 'backend/src/services/conversaTeamRecipients.service.js', 'backend/src/controllers/companyEvents.controller.js', 'backend/src/routes/agency.routes.js', 'frontend/src/components/conversa/ConversaTeamCommunications.vue', 'frontend/src/components/conversa/__tests__/ConversaTeamCommunications.test.js', 'frontend/src/components/admin/StaffPollResultsReview.vue', 'frontend/src/components/admin/__tests__/StaffPollResultsReview.test.js', 'frontend/src/components/dashboard/StaffPollsPanel.vue', 'frontend/src/components/dashboard/__tests__/StaffPollsPanel*.test.js', 'frontend/src/views/StaffEventView.vue', 'frontend/src/views/__tests__/StaffEventView.test.js', 'frontend/vitest.staff-polls.config.js', 'backend/src/utils/staffPollPresentation.js', 'backend/src/services/staffPoll*.js', 'backend/src/services/staffEventPotluck.service.js', 'backend/src/utils/staffPollDeliveryHistory.js', 'frontend/src/components/conversa/StaffPollDeliveryHistory.vue', 'frontend/src/components/conversa/__tests__/StaffPollDeliveryHistory.test.js', 'frontend/src/components/admin/StaffEventForm.vue', 'frontend/src/views/public/CompanyEventRsvpView.vue', 'database/migrations/1784_conversa_poll_delivery_visibility.sql', 'backend/src/services/auricwell/**', 'backend/src/**/__tests__/messaging.*', 'backend/src/**/__tests__/enrollmentCompletion.*', 'backend/vitest.sms-carrier.config.js', '.github/workflows/sms-carrier-boundaries.yml']
permissions:
  contents: read
jobs:
  carrier-boundaries:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: stale_text_ci
          MYSQL_ROOT_PASSWORD: stale_text_ci_only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=stale_text_ci_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend --ignore-scripts
      - name: Verify client, staff and campaign separation without real sends
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.sms-carrier.config.js
      - name: Verify Conversa polls, shared results and internal event links
        run: node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.staff-polls.config.js
      - name: Verify event invitation commands, anonymous details and RSVP totals
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.events.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.company-events.config.js
      - name: Verify stable event links across concurrent workers and event edits
        env:
          EVENT_PAGE_TEST_HOST: 127.0.0.1
          EVENT_PAGE_TEST_PORT: '3306'
          EVENT_PAGE_TEST_PASSWORD: stale_text_ci_only
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.events.config.js backend/src/services/__tests__/events.pageLinks.mysql.test.js
      - name: Verify poll closing and vote-edit locking with MySQL
        env:
          STAFF_POLL_MYSQL_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: stale_text_ci_only
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.sms-carrier.config.js backend/src/services/__tests__/messaging.staffPollLifecycle.mysql.test.js
      - name: Verify stale-text SQL with isolated synthetic fixtures
        env:
          STALE_TEXT_MYSQL_READONLY_TEST: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: stale_text_ci_only
          DB_NAME: stale_text_ci
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.messaging.config.js backend/src/services/__tests__/messaging.staleText.mysql.test.js
      - name: Verify AuricWell client and account verification settings
        env:
          NODE_ENV: test
          SKIP_DB_CONNECT: '1'
        run: node --test --test-force-exit backend/src/services/auricwell/clientMessagingPolicy.test.js backend/src/services/auricwell/sessionIntegrations.test.js backend/src/services/auricwell/verificationSmsPolicy.test.js
