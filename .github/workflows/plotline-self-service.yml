name: Plotline self-service boundaries
on:
  pull_request:
    paths: ['backend/src/**/plotline*','backend/src/**/hiringReference*','backend/src/**/hire.reference*','frontend/src/components/hiring/Reference*','frontend/src/views/public/HiringReferenceFormView.vue','frontend/src/views/__tests__/HiringReferenceForm.test.js','backend/src/middleware/auth.middleware.js','backend/src/middleware/agencyAccessProfiles.middleware.js','backend/src/services/jobApplicantUser.service.js','frontend/src/**/Plotline*','frontend/src/**/plotline*','frontend/src/composables/usePlotlineCompanyScope.js','frontend/src/views/admin/Hiring*','frontend/src/views/admin/CareersView.vue','frontend/src/views/admin/InterviewHubView.vue','frontend/src/components/video/**','frontend/src/App.vue','frontend/src/utils/appReleaseMonitor.js','frontend/vitest.plotline-r5.config.js','frontend/vitest.plotline-r6.config.js','backend/vitest.plotline-r6.config.js','frontend/src/utils/uploadsUrl.js','backend/src/utils/uploads.js','frontend/src/components/supervision/SupervisionVideoLobbyPanel.vue','frontend/src/views/teamMeeting/JoinTeamMeetingView.vue','backend/src/services/teamMeetingRoomCapabilities.service.js','backend/src/controllers/teamMeetings.controller.js','database/migrations/1847_plotline_self_service.sql','.github/workflows/plotline-self-service.yml']
  push:
    branches: [main]
    paths: ['backend/src/**/plotline*','backend/src/**/hiringReference*','backend/src/**/hire.reference*','frontend/src/components/hiring/Reference*','frontend/src/views/public/HiringReferenceFormView.vue','frontend/src/views/__tests__/HiringReferenceForm.test.js','backend/src/middleware/auth.middleware.js','backend/src/middleware/agencyAccessProfiles.middleware.js','backend/src/services/jobApplicantUser.service.js','frontend/src/**/Plotline*','frontend/src/**/plotline*','frontend/src/composables/usePlotlineCompanyScope.js','frontend/src/views/admin/Hiring*','frontend/src/views/admin/CareersView.vue','frontend/src/views/admin/InterviewHubView.vue','frontend/src/components/video/**','frontend/src/App.vue','frontend/src/utils/appReleaseMonitor.js','frontend/vitest.plotline-r5.config.js','frontend/vitest.plotline-r6.config.js','backend/vitest.plotline-r6.config.js','frontend/src/utils/uploadsUrl.js','backend/src/utils/uploads.js','frontend/src/components/supervision/SupervisionVideoLobbyPanel.vue','frontend/src/views/teamMeeting/JoinTeamMeetingView.vue','backend/src/services/teamMeetingRoomCapabilities.service.js','backend/src/controllers/teamMeetings.controller.js','database/migrations/1847_plotline_self_service.sql','.github/workflows/plotline-self-service.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - name: Signup, tenant, trial, burst and route checks
        run: frontend/node_modules/.bin/vitest run --config backend/vitest.plotline.config.js
        env:
          NODE_OPTIONS: --experimental-sqlite
          SKIP_DB_CONNECT: '1'
      - name: Customer setup and shared brand checks
        run: frontend/node_modules/.bin/vitest run --config frontend/vitest.plotline-self-service.config.js
      - name: Hiring company scope, audit and form recovery
        run: frontend/node_modules/.bin/vitest run --config backend/vitest.plotline-r3.config.js
        env:
          NODE_OPTIONS: --experimental-sqlite
          SKIP_DB_CONNECT: '1'
      - name: Interviewer entry and round 4 UI regressions
        run: frontend/node_modules/.bin/vitest run --config frontend/vitest.plotline-r4.config.js
      - name: Named company navigation, video recovery and release status
        run: frontend/node_modules/.bin/vitest run --config frontend/vitest.plotline-r5.config.js
      - name: Interview room controls, public logos and permission isolation
        run: frontend/node_modules/.bin/vitest run --config backend/vitest.plotline-r6.config.js
        env:
          SKIP_DB_CONNECT: '1'
      - name: Round 6 room UI regressions
        run: frontend/node_modules/.bin/vitest run --config frontend/vitest.plotline-r6.config.js
