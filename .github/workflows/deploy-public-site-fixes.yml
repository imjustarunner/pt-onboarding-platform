name: Deploy tested public-site fixes

on:
  workflow_dispatch:

concurrency:
  group: public-site-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-west3

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare release
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          echo "RELEASE_SUFFIX=pub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=pub-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          # Fail before building if the existing services cannot be inspected.
          for service in onboarding-backend onboarding-frontend; do
            gcloud run services describe "$service" --region "$REGION" --format='value(metadata.name)'
          done
      - name: Build and publish images
        run: |
          set -euo pipefail
          BACKEND_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/onboarding-backend/onboarding-backend:$GITHUB_SHA"
          FRONTEND_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/onboarding-frontend/onboarding-frontend:$GITHUB_SHA"
          docker build -f backend/Dockerfile --build-arg VITE_API_URL=/api -t "$BACKEND_IMAGE" .
          docker run --rm --entrypoint node "$BACKEND_IMAGE" -e '
            (async () => {
              await import("./src/services/agents/assistantCapabilityCatalog.service.js");
              await import("./src/services/providerAvailabilityReminders.service.js");
              await import("./src/controllers/providerAvailabilitySettings.controller.js");
              console.log("Backend release modules loaded");
              process.exit(0);
            })().catch(error => { console.error(error); process.exit(1); });'
          docker build --build-arg VITE_API_URL=/api --build-arg VITE_APP_BUILD_ID="$GITHUB_SHA" -t "$FRONTEND_IMAGE" frontend
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
      - name: Deploy candidates without changing runtime settings
        run: |
          set -euo pipefail
          for service in onboarding-backend onboarding-frontend; do
            # Update only the image and temporary routing tag. In particular,
            # preserve all env vars, Secret Manager bindings, IAM and ingress.
            gcloud run deploy "$service" --region "$REGION" \
              --image="$REGION-docker.pkg.dev/$PROJECT_ID/$service/$service:$GITHUB_SHA" \
              --no-traffic --tag="$RELEASE_TAG" --revision-suffix="$RELEASE_SUFFIX" --quiet
          done
      - name: Verify both candidates
        run: |
          set -euo pipefail
          for service in onboarding-backend onboarding-frontend; do
            revision="$service-$RELEASE_SUFFIX"
            candidate_url=$(gcloud run services describe "$service" --region "$REGION" --format=json \
              | jq -er --arg tag "$RELEASE_TAG" --arg revision "$revision" \
              '.status.traffic[] | select(.tag == $tag and .revisionName == $revision) | .url')
            ok=0
            for attempt in $(seq 1 20); do
              if [ "$service" = onboarding-backend ]; then
                if curl --fail --silent --show-error --max-time 15 "$candidate_url/health" \
                  | jq -e '.phase == "app" or .phase == "ready"' >/dev/null; then ok=1; break; fi
              else
                if curl --fail --silent --show-error --max-time 15 "$candidate_url/version.json" \
                  | jq -e --arg sha "$GITHUB_SHA" '.buildId == $sha' >/dev/null; then ok=1; break; fi
              fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then
              echo "Candidate verification failed for $service; live traffic has not changed."
              exit 1
            fi
          done
      - name: Promote verified revisions
        run: |
          set -euo pipefail
          for service in onboarding-backend onboarding-frontend; do
            gcloud run services update-traffic "$service" --region "$REGION" \
              --to-revisions="$service-$RELEASE_SUFFIX=100" --quiet
          done
      - name: Remove temporary candidate URLs
        if: always() && env.RELEASE_TAG != ''
        run: |
          for service in onboarding-backend onboarding-frontend; do
            gcloud run services update-traffic "$service" --region "$REGION" \
              --remove-tags="$RELEASE_TAG" --quiet || true
          done
