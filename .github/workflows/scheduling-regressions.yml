name: Scheduling regressions

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/scheduling-regressions.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/scheduling-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, America/Denver]
    env:
      TZ: ${{ matrix.timezone }}
      SKIP_DB_CONNECT: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend --ignore-scripts
      - name: School portals, enrollment, and appointment notice rules
        run: |
          npm test --prefix frontend -- src/components/availability/__tests__/ProviderSchoolDays.test.js src/components/school/redesign/__tests__/SchoolDayBar.test.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.family-email.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-onboarding.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.qa-sms.config.js schoolAppointment appointmentReplyFeeAcknowledgement scheduling.reminderUtc
          npm test --prefix frontend -- --config vitest.school-links.config.js --maxWorkers=1
          npm test --prefix frontend -- src/router/__tests__/schoolCareBridgeRoutes.test.js src/utils/__tests__/schoolEnrollmentLink.test.js src/utils/__tests__/publicIntakeUrl.test.js src/utils/__tests__/serviceLegalContext.test.js src/services/__tests__/workspaceNavigation.test.js src/views/school/__tests__/SchoolCareBridgeAgencyWorkspace.test.js
      - name: School weekly booking, scheduling requests, and support drafts
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-weekly.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.qa-communications.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.qa-clinical-fixtures.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.draft-session-context.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.scheduling.config.js backend/src/services/__tests__/scheduling.clinicalEdit.test.js backend/src/services/__tests__/scheduling.calendarLocationMetadata.test.js backend/src/services/__tests__/scheduling.providerUpdateAvailability.test.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.school-weekly.config.js)
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.school-calendar.config.js)
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.qa-communications.config.js)
      - name: Clinical catalog, portal setup, and recipient reminder integration
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.clinical-integrations.config.js
      - name: Session deadlines and cross-tab verification request bounds
        working-directory: frontend
        run: node node_modules/vitest/vitest.mjs run src/utils/__tests__/activityTracker.test.js src/utils/__tests__/sessionDeadline.test.js
      - name: Login artwork, dashboard loading, and modular Workspace clients
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.startup-performance.config.js
          node --test backend/src/utils/__tests__/googleApis.test.js backend/src/services/__tests__/outboundEmailQuality.performance.test.js
          npm test --prefix frontend -- src/store/__tests__/dashboardIcons.test.js src/store/__tests__/loginBranding.test.js src/store/__tests__/communicationsCounts.test.js src/services/__tests__/startupRequests.test.js src/components/provider/__tests__/ProviderLoginBriefing.loading.test.js src/views/admin/__tests__/TenantAdminDashboard.loading.test.js src/views/__tests__/LoginPortalIsolation.test.js src/utils/__tests__/completeGoogleLogin.test.js
      - name: Booked clinical sessions in My Work
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.booked-work.config.js
      - name: One-session guardian activity alerts and audit scope
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.portal-activity-watch.config.js
      - name: Outreach trips, school history and huddle compensation
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.submit-on-behalf.config.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.submit-on-behalf.config.js)
          node --test backend/src/services/__tests__/companyEventParticipation.test.js
      - name: Client Exchange staff review and eligibility
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.rachel-school-operations.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.rachel-school-operations.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.client-exchange.config.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.client-exchange.config.js)
          node --test backend/src/utils/__tests__/clientExchangeMatching.test.js backend/src/utils/__tests__/supportExchangeSummary.test.js
      - name: Pre-hire completion, work usernames, and family assignment notices
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.hire.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-visit-status.config.js
          npm test --prefix frontend -- src/utils/__tests__/clientGrade.test.js src/views/__tests__/PreHireView.completion.test.js src/views/__tests__/hire.portal.test.js
      - name: Employee rosters, onboarding reminders, and referral requirements
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.staff-referral-followups.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.staff-referral-followups.config.js
          node --experimental-sqlite --test backend/src/utils/__tests__/employeeRoster.test.js
      - name: Tutoring office and multi-service family contexts
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.tutoring-services.config.js
          npm test --prefix frontend -- --run src/components/meetings/__tests__/PrivateVirtualOffice.test.js src/components/meetings/__tests__/OfficeDayList.test.js src/components/meetings/__tests__/PrivateOfficeGuest.test.js src/components/meetings/__tests__/OfficeWaitingMessages.test.js src/components/guardian/__tests__/FamilyPortalExpansion.test.js src/components/guardian/__tests__/TutorOfficeStatus.test.js src/views/tutoring/__tests__/VirtualTutoringEntry.test.js
      - name: Dependent personal portal isolation and invitations
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.dependent-portal.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.dependent-portal.config.js
      - name: Provider completion and agency countersignature tasks
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.provider-completion.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.countersign-tasks.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.countersign-tasks.config.js
      - name: Enrollment consent loading and guardian contact editing
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.intake-contact.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.guardian-enrollment-policy.config.js
          npm test --prefix frontend -- --run src/components/admin/__tests__/ClientGuardianContactEditor.test.js src/components/public/__tests__/SharedSchoolSigning.test.js src/views/__tests__/PublicIntakeProviderSelection.test.js src/views/__tests__/PublicIntakeSchoolChildren.test.js src/views/__tests__/PublicIntakeInsuranceContinue.test.js src/components/public-intake/__tests__/EnrollmentPortalAccess.test.js src/components/clients/__tests__/ClientPortalInviteDialog.test.js src/components/portal/__tests__/PortalNotificationSetup.test.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.intake-insurance-receipt.config.js
      - name: Core workflow live-QA regressions
        run: |
          npm test --prefix frontend -- src/__tests__/App.publicLogin.test.js src/__tests__/App.workspaceLoading.test.js src/components/__tests__/AgencySelector.workspace.test.js src/components/dashboard/__tests__/ProviderClientsWaitlistScope.test.js src/views/__tests__/PublicIntakeFinalizePending.test.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.adult-enrollment-retest.config.js src/components/admin/__tests__/OfficeIntakeQueuePanel.retest.test.js)
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.qa-support.config.js src/components/admin/clientChart/__tests__/ClientRecordsOverview.receipts.test.js)
          node --test backend/src/services/__tests__/completedIntakeRecord.service.test.js
      - name: Meeting offers, date editing, and optional office referral source
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.meeting-reservations.config.js
          node --test backend/src/config/__tests__/databasePoolLimits.test.js backend/src/utils/__tests__/officeReferralSource.test.js
          npm test --prefix frontend -- --run src/views/__tests__/MeetingTimesView.test.js src/components/schedule/__tests__/MeetingReservationPicker.test.js src/components/schedule/__tests__/meetingDateReschedule.test.js src/utils/__tests__/apiBaseUrl.test.js src/utils/__tests__/notificationActions.test.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.office-referral.config.js)
      - name: Meeting and planned-out API regressions
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.meeting-launch.config.js
          backend/src/utils/__tests__/meetingAudienceGroups.test.js
          backend/src/controllers/__tests__/meetingAudienceScope.test.js
          backend/src/services/__tests__/meetingScheduleTimezone.test.js
          backend/src/services/__tests__/meetingCalendarEmail.test.js
          backend/src/services/__tests__/meetingConfiguredReminders.test.js
          backend/src/services/__tests__/meetingReminders.test.js
          backend/src/controllers/__tests__/scheduling.plannedOuts.test.js
      - name: AuricWell scoped agenda and directory
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.auricwell-agenda.config.js
          (cd frontend && node node_modules/vitest/vitest.mjs run src/auricwell/__tests__/Agenda.test.js src/auricwell/__tests__/Workspace.test.js src/auricwell/__tests__/qaAccess.test.js src/components/schedule/__tests__/TeamScheduleHandoff.test.js)
      - name: Supervision RSVP, internship messaging, and family privacy
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.supervision-safety.config.js
      - name: Supervisor cosign and billing amendment regressions
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.claimmd.config.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.cosign-review.config.js)

      - name: Supervision records, actual time corrections, and concise summaries
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.meeting-launch.config.js
          backend/src/services/__tests__/meetingSupervisionRecord.test.js
          backend/src/services/__tests__/meetingSupervisionSpeakerLabels.test.js
          backend/src/services/__tests__/meetingSummaryContent.test.js
      - name: Meeting follow-up receipts and present-attendee names
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.meeting-followup.config.js
      - name: Scheduled training, RSVP reminders, and private chat
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.scheduled-training.config.js
          npm test --prefix frontend -- --run src/utils/__tests__/scheduledTraining.test.js src/utils/__tests__/teamMeetingInvitationAccess.test.js src/components/meetings/__tests__/ScheduledTrainingPanel.test.js src/components/video/__tests__/VideoSessionRoom.test.js
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.meeting-launch.config.js backend/src/controllers/__tests__/meetingEndAuthority.test.js backend/src/services/__tests__/meetingEndPermission.test.js backend/src/services/__tests__/meetingLastHostCompletion.test.js
          npm test --prefix frontend -- --run src/views/teamMeeting/__tests__/TeamMeetingLeave.test.js src/views/supervision/__tests__/SupervisionLeave.test.js src/components/supervision/__tests__/SupervisionLeaveControls.test.js
      - name: Personal meeting links without app login
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.meeting-launch.config.js
          backend/src/services/__tests__/meetingInvitationResponse.test.js
          backend/src/services/__tests__/meetingSupervisionPersonalAccess.test.js
          backend/src/services/__tests__/meetingTeamPersonalAccess.test.js
          backend/src/services/__tests__/meetingSupervisionReminders.test.js
      - name: Planned-out presence boundaries
        env:
          NODE_ENV: test
        run: node --test backend/src/services/__tests__/plannedOutPresence.service.test.js
      - name: Unified office approval authorization, decisions, and recurring room inventory
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.scheduling.config.js
          backend/src/services/__tests__/scheduling.officeApprovalWorkflow.test.js
          backend/src/services/__tests__/scheduling.officeApprovalInventory.test.js
          backend/src/services/__tests__/scheduling.officeRoomAllocation.test.js
          backend/src/services/__tests__/scheduling.officeCheckinUsage.test.js
          backend/src/services/__tests__/scheduling.officeMoveEmail.test.js
          backend/src/services/__tests__/scheduling.officeRequestEmails.test.js
          backend/src/controllers/__tests__/scheduling.officeApprovalDecision.test.js
          backend/src/controllers/__tests__/scheduling.officeBuildingPhoto.test.js
      - name: Unified office approvals on mobile
        run: npm exec --prefix frontend -- vitest run --config frontend/vitest.office-approvals.config.js
      - name: Office calendar mirrors and private subscriptions
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.calendar-subscriptions.config.js
      - name: Recurring reservations, guardian cancellation, and payroll privacy
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.recurring-reservations.config.js
      - name: Signed and whole-day cancellations, notification delivery, and sender identity
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.meeting-launch.config.js
          backend/src/services/__tests__/scheduling.dayCancellation.test.js
          backend/src/services/__tests__/scheduling.schoolSupport.test.js
          backend/src/controllers/__tests__/scheduling.schoolSupportAccess.test.js
          backend/src/services/__tests__/scheduling.changeWorkflow.test.js
          backend/src/services/__tests__/scheduling.changeService.test.js
          backend/src/services/__tests__/scheduling.cancellationNotifications.test.js
          backend/src/services/__tests__/scheduling.cancellationStorage.test.js
          backend/src/services/__tests__/scheduling.notificationSender.test.js
          backend/src/services/__tests__/scheduling.scheduleNoticeBuffer.test.js
          backend/src/services/__tests__/scheduling.replacementRooms.test.js
          backend/src/services/__tests__/scheduling.replacementOffers.test.js
          backend/src/services/__tests__/scheduling.offerRecipients.test.js
          backend/src/services/__tests__/scheduling.privateOfferPublicCache.test.js
          backend/src/controllers/__tests__/scheduling.replacementOfferAccess.test.js
      - name: Cancellation recipient previews, school absence times, and calendar overlap
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.scheduling.config.js backend/src/services/__tests__/scheduling.cancellationNoticePreview.test.js backend/src/services/__tests__/scheduling.dayCancellation.test.js backend/src/services/__tests__/scheduling.schoolRosterCancellation.test.js backend/src/services/__tests__/scheduling.schoolRosterEmail.test.js backend/src/services/__tests__/scheduling.dayAbsencePolicy.test.js backend/src/services/__tests__/scheduling.cancellationReceipts.test.js backend/src/services/__tests__/scheduling.cancellationOutreach.test.js backend/src/services/__tests__/scheduling.cancellationStorage.test.js backend/src/services/__tests__/scheduling.dayCancellationEmail.test.js backend/src/services/__tests__/scheduling.dayCancellationContactFollowup.test.js backend/src/services/__tests__/scheduling.schoolCancellationCaregivers.test.js backend/src/services/__tests__/scheduling.scheduleNoticeBuffer.test.js
          npm test --prefix frontend -- src/components/schedule/__tests__/dayCancellationDialog.test.js src/components/schedule/__tests__/schoolSoftCalendar.test.js src/utils/__tests__/scheduleOverlapLayout.test.js
      - name: Internal appointment alerts and staff communication access
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.appointment-staff-tools.config.js
      - name: Provider rollout and dashboard invitation safeguards
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.meeting-launch.config.js
          backend/src/services/__tests__/scheduling.clientSessionBookingRollout.test.js
          backend/src/controllers/__tests__/scheduling.clientSessionRolloutAccess.test.js
          backend/src/services/__tests__/scheduling.supervisionSignup.test.js
          backend/src/services/__tests__/scheduling.supervisionSignupWindow.test.js
          backend/src/services/__tests__/meetingUpcomingInvitations.test.js
      - name: Provider waitlist visibility
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.scheduling.config.js
          backend/src/controllers/__tests__/providerEnrollmentWaitlist.test.js
      - name: Calendar conflicts and Google overlays
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.scheduling.config.js
          backend/src/services/__tests__/scheduling.conflictExplanation.test.js
          backend/src/services/__tests__/scheduling.googleCalendarAdvisory.test.js
          backend/src/services/__tests__/scheduling.calendarBusy.test.js
          backend/src/services/__tests__/scheduling.lifecycleRecurrence.test.js
          backend/src/services/__tests__/scheduling.blockRecurrence.test.js
          backend/src/services/__tests__/scheduling.publicAvailability.test.js
          backend/src/services/__tests__/scheduling.providerUpdateAvailability.test.js
          backend/src/services/__tests__/scheduling.officeRequestVisibility.test.js
          backend/src/services/__tests__/scheduling.officeRequestDuration.test.js
          backend/src/controllers/__tests__/providerUpdateRoomRequest.test.js
          backend/src/services/__tests__/scheduling.officeRequestPreferences.test.js
          backend/src/services/__tests__/scheduling.providerUpdateReview.test.js
          backend/src/services/__tests__/scheduleSummaryPrivacy.service.test.js
          backend/src/models/__tests__/scheduling.virtualHoursBatch.test.js
      - name: School account access, welcome mail, and assignment restoration
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.school-support.config.js
      - name: Agency login isolation, enrollment permissions, and portal timestamps
        working-directory: frontend
        run: |
          node node_modules/vitest/vitest.mjs run --config ../backend/vitest.qa-oct28.config.js
          node node_modules/vitest/vitest.mjs run --config vitest.qa-oct28.config.js
      - name: Enrollment receipts, shared-browser login, and staff preferences
        working-directory: frontend
        run: |
          node node_modules/vitest/vitest.mjs run --config ../backend/vitest.qa-oct29.config.js
          TZ=America/Los_Angeles node node_modules/vitest/vitest.mjs run --config vitest.qa-oct29.config.js
      - name: School recovery links, branding, and login stability
        working-directory: frontend
        run: |
          node node_modules/vitest/vitest.mjs run --config ../backend/vitest.password-recovery.config.js
          node node_modules/vitest/vitest.mjs run --config vitest.school-recovery.config.js
      - name: Provider update SSO completion
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.security-notifications.config.js
      - name: School soft schedule calendar placement and cancellation details
        run: node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.school-soft-calendar.config.js
      - name: School provider weekday availability and service focuses
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.school-weekday-availability.config.js
          node frontend/node_modules/vitest/vitest.mjs run --config frontend/vitest.school-weekday-availability.config.js
      - name: Scheduling form and display regressions
        working-directory: frontend
        run: >-
          npm test --
          src/components/admin/__tests__/ClientSessionBookingRollout.test.js
          src/components/meetings/__tests__/DashboardInvitationToasts.test.js
          src/components/provider/__tests__/ProviderEnrollmentWaitlist.test.js
          src/components/schedule/__tests__/SupervisionSignup.test.js
          src/views/__tests__/MyMeetingsView.test.js
          src/components/schedule/__tests__/supervisionScheduler.test.js
          src/components/schedule/__tests__/supervisionActionDialog.test.js
          src/components/schedule/__tests__/SupervisionRecordPanel.test.js
          src/components/schedule/__tests__/SupervisionProgress.test.js
          src/components/supervision/__tests__/SupervisionHoursRefresh.test.js
          src/components/schedule/__tests__/SupervisionAttendeeMandatoryPanel.test.js
          src/components/schedule/__tests__/supervisionNotificationSettings.test.js
          src/views/teamMeeting/__tests__/personalInvitation.test.js
          src/components/schedule/__tests__/scheduleBlocks.test.js
          src/components/schedule/__tests__/scheduleOverlap.test.js
          src/components/schedule/__tests__/scheduleLoading.test.js
          src/components/schedule/__tests__/scheduleDayLayout.test.js
          src/components/schedule/__tests__/scheduleQuarterHourPicker.test.js
          src/components/schedule/__tests__/scheduleQuarterHourFlow.test.js
          src/components/schedule/__tests__/dayCancellationDialog.test.js
          src/components/schedule/__tests__/AppointmentStaffTools.test.js
          src/components/schedule/__tests__/AppointmentCommunicationsPanel.test.js
          src/components/schedule/__tests__/OfferedTimeDialog.test.js
          src/components/guardian/__tests__/GuardianAppointmentsPanel.test.js
          src/composables/__tests__/AppointmentChangeWizard.test.js
          src/components/schedule/__tests__/SchoolSupportCancellationBenefit.test.js
          src/composables/__tests__/useAppointmentChange.test.js
          src/utils/__tests__/scheduleVisibleHours.test.js
          src/utils/__tests__/scheduleSummaryRequests.test.js
          src/utils/__tests__/officeRequestWindows.test.js
          src/views/__tests__/DashboardScheduleStartup.test.js
          src/components/provider/__tests__/ProviderUpdateQuickView.test.js
          src/components/school/redesign/__tests__/SchoolAdminAccessRequests.test.js
          src/components/school/redesign/__tests__/SchoolStaffPanel.phone.test.js
          src/components/school/redesign/__tests__/SchoolStaffPanel.recovery.test.js
          src/components/provider/__tests__/ProviderUpdateOfficeSchedule.test.js
          src/components/provider/__tests__/ProviderHoursFocus.test.js
          src/utils/__tests__/providerUpdateCalendar.test.js
          src/components/meetings/__tests__/DashboardMeetings.test.js
          src/utils/__tests__/scheduleOverlapLayout.test.js
          src/utils/__tests__/scheduleAppearance.test.js
          src/components/schedule/__tests__/scheduleColorSettings.test.js
          src/utils/__tests__/recurringWindow.test.js
          src/views/__tests__/OfficeScheduleView.test.js
          src/views/__tests__/OfficeApprovalsView.test.js
          src/components/admin/opsDashboard/__tests__/PlannedOutModal.test.js
          src/utils/__tests__/plannedOutTimezone.test.js

  provider-offboarding:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SCHEDULING_TEST_MYSQL_PORT: '3306'
      SKIP_DB_CONNECT: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend --ignore-scripts
      - name: School staff reactivation and archive audit
        env:
          ACCOUNT_LIFECYCLE_MYSQL_TEST: '1'
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.account-lifecycle.config.js
      - name: Clinical catalog and reminder persistence
        env:
          CLINICAL_INTEGRATION_MYSQL_PORT: '3306'
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.clinical-integrations.config.js backend/src/services/__tests__/clinicalIntegration.mysql.test.js
      - name: One-session alert persistence and concurrent workers
        env:
          PORTAL_ACTIVITY_MYSQL_PORT: '3306'
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.portal-activity-watch.config.js backend/src/services/__tests__/portalActivityWatch.mysql.test.js
      - name: Family enrollment, sibling recovery, and duplicate merge preservation
        env:
          EVIDENCE_TEST_MYSQL_PORT: '3306'
        run: |
          (cd backend && node ../frontend/node_modules/vitest/vitest.mjs run --config vitest.family-enrollment.config.js)
          node --test backend/src/controllers/__tests__/sharedIntakeArtifacts.test.js
          (cd frontend && node node_modules/vitest/vitest.mjs run --config vitest.family-enrollment.config.js)
      - name: Provider archive cleanup and scheduling integration
        run: >-
          node frontend/node_modules/vitest/vitest.mjs run
          --config backend/vitest.scheduling.config.js
          backend/src/services/__tests__/scheduling.providerOffboarding.mysql.test.js
          backend/src/services/__tests__/scheduling.mysql.test.js
          backend/src/services/__tests__/scheduling.officeReconciliation.mysql.test.js
          backend/src/services/__tests__/scheduling.officeRequestEmails.mysql.test.js
          backend/src/services/__tests__/scheduling.supervisionTimeCorrection.mysql.test.js
          backend/src/services/__tests__/scheduling.supervisionScheduleActions.mysql.test.js
          backend/src/services/__tests__/scheduling.schoolSupport.mysql.test.js
          backend/src/services/__tests__/scheduling.schoolStatusTransitions.mysql.test.js
      - name: Work username reservation transactions
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.hire.config.js backend/src/services/__tests__/hire.username.mysql.test.js
      - name: Brief B paper processing and targeted retest
        run: |
          node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.brief-b-targeted.config.js
          npm test --prefix frontend -- src/components/clients/__tests__/SchoolPaperPacketWorkflow.test.js src/components/billing/__tests__/ClientInsuranceEditor.test.js src/components/public-intake/__tests__/InsurancePaymentEnrollment.test.js src/views/__tests__/PublicIntakeFollowup.test.js src/utils/__tests__/calendarDate.test.js src/utils/__tests__/otherGuardianDraft.test.js src/components/admin/__tests__/ClientCommunicationsTab.race.test.js
