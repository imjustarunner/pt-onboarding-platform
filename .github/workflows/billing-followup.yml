permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: family_billing_test
          MYSQL_USER: family_billing_test
          MYSQL_PASSWORD: synthetic-only
        ports: ['33316:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SKIP_DB_CONNECT: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DB_HOST: '127.0.0.1'
      DB_PORT: '33316'
      DB_NAME: family_billing_test
      DB_USER: family_billing_test
      DB_PASSWORD: synthetic-only
      CLINICAL_DB_HOST: '127.0.0.1'
      CLINICAL_DB_PORT: '33316'
      CLINICAL_DB_NAME: family_billing_test
      CLINICAL_DB_USER: family_billing_test
      CLINICAL_DB_PASSWORD: synthetic-only
      FAMILY_BILLING_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Synthetic fixture encryption only; never a production key.
      CLIENT_CHAT_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BILLING_FOLLOWUP_MYSQL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend --ignore-scripts
      - name: Reminder delivery and notification ownership
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.billing-followup.config.js
      - name: Standard family emails and appointment responses
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.family-email.config.js
      - name: Native SQL workflow and policy checks
        run: node --test backend/src/services/__tests__/billingFollowup.mysql.test.js backend/src/services/__tests__/insuranceCards.policy.test.js backend/src/services/__tests__/familyLedger.policy.test.js
      - name: Attendance copay authorization and timing
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.attendance-copays.config.js
      - name: Attendance copay SQL concurrency and final payer reconciliation
        env:
          ATTENDANCE_COPAY_MYSQL_TEST: '1'
        run: node --test backend/src/services/__tests__/copayAttendance.mysql.test.js
      - name: Cost estimate policy and document access
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.cost-estimates.config.js
      # This extends the synthetic billing fixture created by the previous SQL
      # step. It never resets the fixture or contacts an external transport.
      - name: Migration deduplication and encrypted cost estimate SQL
        env:
          FAMILY_PORTAL_ESTIMATE_MYSQL_TEST: '1'
        run: node --test backend/src/services/__tests__/familyCostEstimates.mysql.test.js
      - name: Claim and documentation verification
        run: node frontend/node_modules/vitest/vitest.mjs run --config backend/vitest.claimmd.config.js
      - name: Portal welcome and private issue reports
        run: npm --prefix frontend test -- --config vitest.guardian-onboarding.config.js
      - name: Family portal navigation, onboarding, and secure messages
        run: npm --prefix frontend test -- --config vitest.family-refinement.config.js
      - name: Note Workspace session draft and work queue navigation
        run: npm --prefix frontend test -- --config vitest.note-workspace.config.js
      - name: Guardian and billing workspace screens
        run: npm --prefix frontend test -- src/components/billing/__tests__/FamilyLedgerPanel.test.js src/components/billing/__tests__/InsuranceCardTasks.test.js src/components/billing/__tests__/BillingFollowupTasks.test.js src/components/billing/__tests__/ClientDocumentationReadiness.test.js src/components/billing/__tests__/EligibilityAutomationPanel.test.js src/components/billing/__tests__/ClientInsuranceEditor.test.js src/views/admin/__tests__/BillingWorkspaceView.test.js src/views/__tests__/FundThredCollections.test.js src/components/fundthred/__tests__/FundThred.test.js src/router/__tests__/fundthredRoutes.test.js src/utils/__tests__/fundthred.test.js
