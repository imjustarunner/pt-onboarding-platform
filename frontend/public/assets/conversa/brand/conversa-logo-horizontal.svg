<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 176" fill="none">
  <g transform="translate(4 7) scale(.6)">
  <defs>
    <radialGradient id="conversa-blue" cx=".32" cy=".14" r=".94">
      <stop stop-color="#0B48CB"/>
      <stop offset=".38" stop-color="#0038BE"/>
      <stop offset=".76" stop-color="#07328C"/>
      <stop offset="1" stop-color="#002352"/>
    </radialGradient>
    <linearGradient id="conversa-gold" x1="81" y1="104" x2="150" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A97611"/>
      <stop offset=".38" stop-color="#D4A017"/>
      <stop offset=".76" stop-color="#F1CA61"/>
      <stop offset="1" stop-color="#FFE49A"/>
    </linearGradient>
    <linearGradient id="conversa-facet" x1="128" y1="25" x2="194" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0B2"/>
      <stop offset=".46" stop-color="#EAC05C"/>
      <stop offset="1" stop-color="#B17D16"/>
    </linearGradient>
    <linearGradient id="conversa-pearl" x1="108" y1="127" x2="108" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F6FF"/>
    </linearGradient>
  </defs>
  <!-- Board silhouette: one circular conversation field with an integrated tail. -->
  <path d="M128 16C68 16 20 64 20 124C20 156 34 185 57 205L48 244L88 226C100 231 114 233 128 233C188 233 236 185 236 124C236 64 188 16 128 16Z" fill="url(#conversa-blue)"/>
