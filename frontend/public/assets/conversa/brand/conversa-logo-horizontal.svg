  <path d="M128 14L215 146C183 129 160 106 133 99C107 91 84 95 60 107Z" fill="#FFFFFF"/>
  <path d="M128 25L199 131C174 115 153 99 130 94C110 88 93 92 76 99Z" fill="url(#conversa-gold)"/>
  <path d="M128 25L109 87L76 99L116 93Z" fill="#A97611" fill-opacity=".62"/>
  <path d="M128 25L199 131L150 100Z" fill="url(#conversa-facet)"/>
  <path d="M128 25L129 64L123 58L112 89L107 93L130 92L150 100Z" fill="#FFE18A"/>
  <path d="M128 25L129 64L123 58L112 89Z" fill="#FFF2BE" fill-opacity=".58"/>
  <!-- The blue wave shares the conversation field; only its upper edge is separated. -->
  <path d="M171 118C200 139 222 160 246 161C221 177 192 166 165 147Z" fill="url(#conversa-blue)"/>
  <path d="M28 174C30 142 47 116 76 103C109 88 141 96 171 118C200 139 222 160 246 161" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- The broad conversation bubble and wave share the same continuous white shape. -->
  <path d="M61 138C86 122 116 122 143 137C174 153 207 176 236 169C213 183 189 176 169 168C166 190 145 207 116 208C81 210 53 192 53 166C53 154 55 142 61 138Z" fill="url(#conversa-pearl)"/>
  <circle cx="84" cy="164" r="7.3" fill="#002E82"/>
  <circle cx="109" cy="164" r="7.3" fill="#002E82"/>
  <circle cx="134" cy="164" r="7.3" fill="#002E82"/>
  </g>
  <text x="167" y="105" font-family="Inter,Arial,sans-serif" font-size="91" font-weight="800" letter-spacing="-4.5" fill="#07347F">Conversa</text>
  <text x="172" y="150" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="500" fill="#475569">by <tspan font-weight="700" fill="#07347F">Plot Twist Co.</tspan></text>
</svg>
