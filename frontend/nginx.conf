map $http_host $share_name {
    default "PlotTwist HQ";
    app.itsco.health "ITSCO";
    app.nextleveluplcc.com "Next Level Up";
    app.mh4kidz.com "MH4Kidz";
    app.plottwistco.com "Plot Twist Co";
    app.mentalrange.org "Mental Range";
    app.rockymountainmentors.org "Rocky Mountain Mentors";
    app.rmmentors.com "Rocky Mountain Mentors";
    app.risereviveco.com "Rise Revive Co";
    app.theinnerstrengthinstitute.com "The Inner Strength Institute";
    plottwisthq.com "PlotTwist HQ";
    www.plottwisthq.com "PlotTwist HQ";
}

map $http_host $share_image {
    default "/branding/plottwisthq-platform-bg.png";
    app.itsco.health "/assets/careers/heroes/itsco-framed.png";
    app.nextleveluplcc.com "/assets/careers/heroes/nlu-framed.png";
}

map $request_uri $page_share_name {
    default $share_name;
    ~^/p/kimi(?:/|[?]|$) "Kimi Cain Life Coaching";
}

map $request_uri $share_desc {
    ~^/p/kimi(?:/|[?]|$) "Certified life coaching for clarity, goals, life transitions, and personal growth. Explore coaching packages or book a free consultation.";
    default "Care, scheduling, billing, and support.";
    ~*^/support(/|$) "Call, text, or send a message. We are here to help.";
    ~*^/.+/support(/|$) "Call, text, or send a message. We are here to help.";
    ~*^/join(/|$) "Start intake or join a program.";
    ~*^/.+/join(/|$) "Start intake or join a program.";
    ~*^/careers(/|$) "Explore open roles and how to apply.";
    ~*^/.+/careers(/|$) "Explore open roles and how to apply.";
    ~*^/login(/|$) "Sign in to your account.";
    ~*^/.+/login(/|$) "Sign in to your account.";
    ~*^/bookclub(/|$) "Join the book club and see current reads.";
    ~*^/.+/bookclub(/|$) "Join the book club and see current reads.";
    ~*^/book-club(/|$) "Join the book club and see current reads.";
    ~*^/.+/book-club(/|$) "Join the book club and see current reads.";
    ~*^/book "Request a time with our team.";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/tenant-legal-locations.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ^~ /_public-sites/ { return 404; }
    location = /fundthred { add_header Cache-Control "no-cache"; try_files /_public-sites/fundthred/home.html =404; }
    location = /fundthred/ { absolute_redirect off; return 301 /fundthred$is_args$args; }
    location ~ ^/fundthred/(product|solutions|pricing|resources|start)/?$ {
        add_header Cache-Control "no-cache";
        try_files /_public-sites/fundthred/$1.html =404;
    }
    location = /fundthred/sitemap.xml { default_type application/xml; try_files /_public-sites/fundthred/sitemap.xml =404; }
    # Public marketing alias; /sstc/* remains the existing application.
    location = /p/sstc { add_header Cache-Control "no-cache"; try_files /_public-sites/sstc-alias/home.html =404; }
    location = /p/sstc/ { absolute_redirect off; return 301 /p/sstc$is_args$args; }
    location ~ ^/p/sstc/(features|how-it-works|groups|tour|pricing|faq|about|contact)/?$ {
        add_header Cache-Control "no-cache";
        try_files /_public-sites/sstc-alias/$1.html =404;
    }
    location = /assets/sstc/site.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /assets/sstc/browser.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /kiosk-welcome/1 { add_header Cache-Control "no-store"; try_files /_public-sites/office-1/home.html =404; }
    location = /kiosk-welcome/6 { add_header Cache-Control "no-store"; try_files /_public-sites/office-6/home.html =404; }
    location = /kiosk-welcome/1/ { add_header Cache-Control "no-store"; try_files /_public-sites/office-1/home.html =404; }
    location = /kiosk-welcome/6/ { add_header Cache-Control "no-store"; try_files /_public-sites/office-6/home.html =404; }

    # SPA fallbacks internally redirect here, so headers must also be set on
    # the final HTML location (nginx does not retain the originating location).
    location = /schoolcarebridge/demo { add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex" always; try_files /schoolcarebridge-demo.html =404; }
    location = /schoolcarebridge/demo/ { absolute_redirect off; return 301 /schoolcarebridge/demo$is_args$args; }
    location = /schoolcarebridge-demo.html { add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex" always; try_files $uri =404; }

    location = /auricwell/demo { add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex, nofollow" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; try_files /auricwell-demo.html =404; }
    location = /auricwell/demo/ { absolute_redirect off; return 301 /auricwell/demo$is_args$args; }
    location = /auricwell-demo.html { add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex, nofollow" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; try_files $uri =404; }

    location = /auricwell.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Only these public consulting pages bypass the authenticated application.
    # Invitations, login and all tenant routes continue to use the app below.
    location = /michael { add_header Cache-Control "no-cache"; try_files /michael/site/home.html =404; }
    location = /michael/ { absolute_redirect off; return 301 /michael$is_args$args; }
    location ~ ^/michael/(services|coaching|running-coaching|college-planning|college-coach-consulting|private-practice|scale-your-practice|ai-development|business-growth|nonprofits|packages|work|about|contact|pay|privacy|terms)/?$ {
        add_header Cache-Control "no-cache";
        try_files /michael/site/$1.html =404;
    }
    location ^~ /michael/site/ { return 404; }
    location = /michael/site.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /michael/browser.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /michael/sitemap.xml { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location = /auricwell { add_header Cache-Control "no-cache"; try_files /auricwell/site/home.html =404; }
    location = /auricwell/product { add_header Cache-Control "no-cache"; try_files /auricwell/site/product.html =404; }
    location = /auricwell/security { add_header Cache-Control "no-cache"; try_files /auricwell/site/security.html =404; }
    location = /auricwell/about { add_header Cache-Control "no-cache"; try_files /auricwell/site/about.html =404; }
    location = /auricwell/contact { add_header Cache-Control "no-cache"; try_files /auricwell/site/contact.html =404; }
    location = /auricwell/ { absolute_redirect off; return 301 /auricwell$is_args$args; }
    location = /auricwell/logo.png { try_files $uri =404; }
    location ^~ /auricwell/examples/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /auricwell/website-demo.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /auricwell/website-demo.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /auricwell/website.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ^~ /auricwell/site/ { return 404; }
    location = /auricwell/app { rewrite ^ /auricwell.html last; }
    location ^~ /auricwell/app/ { rewrite ^ /auricwell.html last; }
    location ^~ /auricwell/ {
        # Preserve the external HTTPS origin behind Cloud Run's HTTP proxy.
        absolute_redirect off;
        rewrite ^/auricwell/(product|security|about|contact)/$ /auricwell/$1 permanent;
        rewrite ^/auricwell/(.*)$ /auricwell/app/$1 permanent;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<title>Portal</title>' '<title>$page_share_name</title>';
        sub_filter 'content="Portal"' 'content="$page_share_name"';
        sub_filter 'content="Care, scheduling, billing, and support."' 'content="$share_desc"';
        sub_filter 'https://plottwisthq.com/api/public/share-preview/image' 'https://$http_host/api/public/share-preview/image?path=$request_uri';
        sub_filter 'href="/branding/plottwisthq-platform-bg.png"' 'href="$share_image"';
        try_files /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # nginx's bundled MIME table does not consistently include ES modules.
    # PDF.js loads its worker as a module; octet-stream + nosniff rejects it.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<title>Portal</title>' '<title>$page_share_name</title>';
        sub_filter 'content="Portal"' 'content="$page_share_name"';
        sub_filter 'content="Care, scheduling, billing, and support."' 'content="$share_desc"';
        sub_filter 'https://plottwisthq.com/api/public/share-preview/image' 'https://$http_host/api/public/share-preview/image?path=$request_uri';
        sub_filter 'href="/branding/plottwisthq-platform-bg.png"' 'href="$share_image"';
    }
}
